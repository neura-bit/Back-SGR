name: Deploy Seguimiento Mensajeros TEST to Hostinger

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: seguim-test-deploy
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: test-${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: "maven"

      - name: Build JAR (skip tests)
        run: mvn -B -DskipTests package

      - name: Compute image repo (lowercase for GHCR)
        id: vars
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=$REPO_LC" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            JAR_FILE=target/seguimiento-mensajeros-0.0.1-SNAPSHOT.jar
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ steps.vars.outputs.repo_lc }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ steps.vars.outputs.repo_lc }}:test-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository (para copiar docker-compose.test.yml)
        uses: actions/checkout@v4

      - name: Deploy TEST to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "==> Entrando a carpeta de despliegue TEST"
            mkdir -p "$HOME/BackSeguimientoMensajeros-TEST"
            cd "$HOME/BackSeguimientoMensajeros-TEST"

            echo "==> Reescribiendo archivo .env"
            cat > .env << 'EOF'
            SPRING_DATASOURCE_URL_TEST=${{ secrets.SPRING_DATASOURCE_URL_TEST }}
            SPRING_DATASOURCE_USERNAME_TEST=${{ secrets.SPRING_DATASOURCE_USERNAME_TEST }}
            SPRING_DATASOURCE_PASSWORD_TEST=${{ secrets.SPRING_DATASOURCE_PASSWORD_TEST }}
            EOF

            echo "==> Copiando docker-compose.test.yml"
            cat > docker-compose.yml << 'COMPOSE_EOF'
            version: "3.9"

            services:
              seguimiento-mensajeros-test:
                container_name: seguimiento-mensajeros-test
                image: ghcr.io/neura-bit/back-sgr:test-latest
                restart: unless-stopped

                ports:
                  - "8081:8080"

                volumes:
                  - ./uploads-test:/app/uploads

                environment:
                  TZ: "America/Guayaquil"
                  SERVER_PORT: "8080"
                  SPRING_PROFILES_ACTIVE: "test"
                  FILE_UPLOAD_DIR: "/app/uploads"

                  SPRING_DATASOURCE_URL_TEST: "${SPRING_DATASOURCE_URL_TEST}"
                  SPRING_DATASOURCE_USERNAME_TEST: "${SPRING_DATASOURCE_USERNAME_TEST}"
                  SPRING_DATASOURCE_PASSWORD_TEST: "${SPRING_DATASOURCE_PASSWORD_TEST}"

                healthcheck:
                  test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
                  interval: 20s
                  timeout: 5s
                  retries: 6
                  start_period: 40s
            COMPOSE_EOF

            echo "==> Haciendo pull de la última imagen TEST"
            docker compose pull seguimiento-mensajeros-test || true

            echo "==> Levantando/actualizando servicio seguimiento-mensajeros-test"
            docker compose up -d seguimiento-mensajeros-test

            echo "==> Limpiando imágenes antiguas"
            docker image prune -f >/dev/null 2>&1 || true

            echo "✅ Deploy Seguimiento Mensajeros TEST completado"
