name: Deploy Seguimiento Mensajeros TEST to Hostinger

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: seguim-test-deploy
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: test-${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: "maven"

      - name: Build JAR (skip tests)
        run: mvn -B -DskipTests package

      - name: Compute image repo (lowercase for GHCR)
        id: vars
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=$REPO_LC" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            JAR_FILE=target/seguimiento-mensajeros-0.0.1-SNAPSHOT.jar
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ steps.vars.outputs.repo_lc }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ steps.vars.outputs.repo_lc }}:test-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.test.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "docker-compose.test.yml"
          target: "$HOME/BackSeguimientoMensajeros-TEST"
          strip_components: 0

      - name: Deploy TEST to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "==> Entrando a carpeta de despliegue TEST"
            mkdir -p "$HOME/BackSeguimientoMensajeros-TEST"
            cd "$HOME/BackSeguimientoMensajeros-TEST"

            echo "==> Reescribiendo archivo .env"
            printf 'SPRING_DATASOURCE_URL_TEST=%s\nSPRING_DATASOURCE_USERNAME_TEST=%s\nSPRING_DATASOURCE_PASSWORD_TEST=%s\nFIREBASE_SERVICE_ACCOUNT_BASE64=%s\n' '${{ secrets.SPRING_DATASOURCE_URL_TEST }}' '${{ secrets.SPRING_DATASOURCE_USERNAME_TEST }}' '${{ secrets.SPRING_DATASOURCE_PASSWORD_TEST }}' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}' > .env

            echo "==> Renombrando compose file"
            mv -f docker-compose.test.yml docker-compose.yml

            echo "==> Deteniendo contenedor anterior (si existe)"
            docker compose down || true

            echo "==> Haciendo pull de la última imagen TEST"
            docker compose pull seguimiento-mensajeros-test || true

            echo "==> Levantando/actualizando servicio seguimiento-mensajeros-test"
            docker compose up -d seguimiento-mensajeros-test

            echo "==> Limpiando imágenes antiguas"
            docker image prune -f >/dev/null 2>&1 || true

            echo "✅ Deploy Seguimiento Mensajeros TEST completado"
